<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RUDRA — Command Center</title>
  <style>
    :root {
      --bg:#06070c; --panel:#11131c; --panel2:#0b0d15; --line:#232a40;
      --text:#eef2fb; --muted:#8a93b3; --accent:#6f8cff; --accent2:#3df2c8;
      --danger:#ff5c7a; --warn:#ffc857;
    }
    * { box-sizing: border-box; }
    html, body { margin:0; height:100%; }
    body {
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--bg);
      color:var(--text); min-height:100vh; position:relative; overflow-x:hidden;
    }

    /* ambient animated background */
    #bg-canvas { position:fixed; inset:0; z-index:0; opacity:.55; }
    .glow {
      position:fixed; width:60vw; height:60vw; border-radius:50%; z-index:0;
      filter:blur(90px); opacity:.28; pointer-events:none;
      animation: drift 22s ease-in-out infinite alternate;
    }
    .glow.a { background:#3d5bff; top:-20vw; left:-15vw; }
    .glow.b { background:#19e0b0; bottom:-25vw; right:-15vw; animation-delay:6s; }
    @keyframes drift {
      0%   { transform:translate(0,0) scale(1); }
      50%  { transform:translate(4vw,3vw) scale(1.08); }
      100% { transform:translate(-3vw,-2vw) scale(0.96); }
    }

    header {
      position:relative; z-index:5;
      padding:22px 32px; border-bottom:1px solid var(--line);
      display:flex; align-items:center; gap:16px; position:sticky; top:0;
      background:rgba(6,7,12,0.72); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    }
    .orb {
      width:38px; height:38px; border-radius:50%;
      background: radial-gradient(circle at 35% 30%, #9fb4ff, #3d5bff 55%, #1a2566 100%);
      box-shadow: 0 0 18px 2px rgba(95,130,255,.55), inset 0 0 10px rgba(255,255,255,.25);
      position:relative; flex:none;
    }
    .orb::after {
      content:''; position:absolute; inset:-6px; border-radius:50%;
      border:1px solid rgba(95,130,255,.4); animation: pulse 2.4s ease-out infinite;
    }
    @keyframes pulse { 0%{ transform:scale(.85); opacity:.9; } 100%{ transform:scale(1.5); opacity:0; } }
    .orb.thinking { animation: spin 1.1s linear infinite; }
    @keyframes spin { to { filter: hue-rotate(360deg); } }

    .dot { width:10px; height:10px; border-radius:50%; background:var(--warn); box-shadow:0 0 10px var(--warn); transition:.3s; }
    .dot.online { background:var(--accent2); box-shadow:0 0 10px var(--accent2); }
    .dot.offline { background:var(--danger); box-shadow:0 0 10px var(--danger); }
    h1 { font-size:21px; margin:0; letter-spacing:4px; font-weight:700;
         background:linear-gradient(90deg,#fff,#b9c6ff); -webkit-background-clip:text; background-clip:text; color:transparent; }
    .sub { color:var(--muted); font-size:12.5px; display:flex; align-items:center; gap:8px; margin-top:2px; }

    main {
      position:relative; z-index:5;
      padding:28px; display:grid; gap:20px;
      grid-template-columns: 1.4fr 1fr; max-width:1240px; margin:0 auto;
    }
    @media (max-width: 880px) { main { grid-template-columns: 1fr; } }

    .card {
      background:linear-gradient(160deg, var(--panel), var(--panel2));
      border:1px solid var(--line); border-radius:18px; padding:20px 22px;
      display:flex; flex-direction:column;
      box-shadow: 0 18px 40px -22px rgba(0,0,0,.6);
      transition: border-color .3s;
    }
    .card:hover { border-color:#33406a; }
    .card h2 { font-size:12.5px; color:var(--muted); margin:0 0 14px; text-transform:uppercase; letter-spacing:1.8px; font-weight:600; }
    .pill { display:inline-block; padding:5px 11px; border-radius:999px; background:var(--panel2); border:1px solid var(--line); color:var(--muted); font-size:12px; margin:3px 4px 0 0; transition:.2s; }
    .pill.cap { color:var(--text); cursor:default; }
    .pill.cap:hover { border-color:var(--accent); color:var(--accent2); }
    .mono { font-family:ui-monospace, "SF Mono", Consolas, monospace; }

    /* Chat */
    #chat-card { grid-row: span 2; min-height: 560px; }
    #chat-log { flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:12px; padding:4px 4px 14px; }
    #chat-log::-webkit-scrollbar { width:6px; }
    #chat-log::-webkit-scrollbar-thumb { background:var(--line); border-radius:3px; }
    .msg { max-width:85%; padding:11px 15px; border-radius:14px; font-size:14.5px; line-height:1.5; white-space:pre-wrap;
           animation: rise .25s ease-out; }
    @keyframes rise { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }
    .msg.user { align-self:flex-end; background:linear-gradient(135deg,var(--accent),#4a5fe0); color:#fff; border-bottom-right-radius:4px; box-shadow:0 6px 18px -8px rgba(111,140,255,.6); }
    .msg.rudra { align-self:flex-start; background:var(--panel2); border:1px solid var(--line); border-bottom-left-radius:4px; }
    .msg.sys { align-self:center; color:var(--muted); font-size:12px; font-style:italic; }
    .msg.thinking { align-self:flex-start; display:flex; gap:5px; padding:14px 16px; }
    .msg.thinking span { width:6px; height:6px; border-radius:50%; background:var(--accent2); animation: bounce 1.1s infinite; }
    .msg.thinking span:nth-child(2) { animation-delay:.15s; }
    .msg.thinking span:nth-child(3) { animation-delay:.3s; }
    @keyframes bounce { 0%,60%,100% { transform:translateY(0); opacity:.4; } 30% { transform:translateY(-4px); opacity:1; } }

    #chat-form { display:flex; gap:10px; margin-top:12px; }
    #chat-input {
      flex:1; background:var(--panel2); border:1px solid var(--line); border-radius:12px;
      padding:12px 15px; color:var(--text); font-size:14.5px; outline:none; transition:border-color .2s;
    }
    #chat-input:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(111,140,255,.15); }
    .icon-btn {
      width:44px; height:44px; border-radius:12px; border:1px solid var(--line); background:var(--panel2);
      color:var(--muted); cursor:pointer; font-size:18px; display:flex; align-items:center; justify-content:center;
      transition:.2s; flex:none;
    }
    .icon-btn:hover { color:var(--text); border-color:var(--accent); }
    .icon-btn.active { background:var(--danger); border-color:var(--danger); color:#fff; animation:micpulse 1.2s infinite; }
    @keyframes micpulse { 0%,100%{ box-shadow:0 0 0 0 rgba(255,92,122,.5); } 50%{ box-shadow:0 0 0 8px rgba(255,92,122,0); } }
    #chat-form button[type=submit] {
      background:linear-gradient(135deg,var(--accent),#4a5fe0); color:#fff; border:none; border-radius:12px;
      padding:0 22px; font-weight:600; cursor:pointer; font-size:14px;
    }
    #chat-form button:disabled { opacity:.5; cursor:default; }
    .chat-toolbar { display:flex; justify-content:flex-end; gap:8px; margin-bottom:10px; }
    .toggle { display:flex; align-items:center; gap:6px; font-size:12px; color:var(--muted); cursor:pointer; user-select:none; }
    .toggle input { accent-color: var(--accent); }

    /* Logs */
    .log { font-family:ui-monospace,monospace; font-size:11.5px; color:var(--muted); white-space:pre-wrap; overflow-y:auto; max-height:220px; line-height:1.6; }

    footer { position:relative; z-index:5; padding:20px 28px; color:var(--muted); font-size:12px; text-align:center; }
    footer code { color:var(--accent2); }
    a { color: var(--accent2); }
  </style>
</head>
<body>
  <canvas id="bg-canvas"></canvas>
  <div class="glow a"></div>
  <div class="glow b"></div>

  <header>
    <div class="orb" id="orb"></div>
    <div>
      <h1>RUDRA</h1>
      <div class="sub"><span class="dot" id="conn-dot" title="connecting…"></span><span id="subtitle">connecting…</span></div>
    </div>
  </header>

  <main>
    <section class="card" id="chat-card">
      <h2>Talk to RUDRA</h2>
      <div class="chat-toolbar">
        <label class="toggle"><input type="checkbox" id="voice-toggle" checked /> speak replies</label>
      </div>
      <div id="chat-log"></div>
      <form id="chat-form">
        <button type="button" class="icon-btn" id="mic-btn" title="Voice input">🎙️</button>
        <input id="chat-input" type="text" placeholder="Type a command… e.g. 'what time is it?'" autocomplete="off" />
        <button id="chat-send" type="submit">Send</button>
      </form>
    </section>

    <section class="card">
      <h2>Subsystems</h2>
      <span class="pill">🧠 brain</span><span class="pill">🔌 bus</span>
      <span class="pill">👂 voice</span><span class="pill">🧠 memory</span>
      <span class="pill">🧩 skills</span>
    </section>

    <section class="card">
      <h2>Online devices</h2>
      <div class="log" id="devices">— none yet —</div>
    </section>

    <section class="card">
      <h2>Capabilities</h2>
      <div id="capabilities">loading…</div>
    </section>

    <section class="card">
      <h2>Live log</h2>
      <div class="log" id="bus-log">connecting…</div>
    </section>
  </main>

  <footer>
    RUDRA — built phase by phase. See <code>docs/ROADMAP.md</code> on
    <a href="https://github.com/rudraxdevelopment98-cell/rudra" target="_blank" rel="noopener">GitHub</a>.
  </footer>

  <script>
    // ---------- ambient starfield background ----------
    (function () {
      const canvas = document.getElementById('bg-canvas');
      const ctx = canvas.getContext('2d');
      let stars = [];
      function resize() {
        canvas.width = innerWidth; canvas.height = innerHeight;
        stars = Array.from({ length: Math.floor((innerWidth * innerHeight) / 9000) }, () => ({
          x: Math.random() * innerWidth, y: Math.random() * innerHeight,
          r: Math.random() * 1.3 + 0.2, s: Math.random() * 0.015 + 0.003, p: Math.random() * Math.PI * 2,
        }));
      }
      function tick() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        for (const star of stars) {
          star.p += star.s;
          const alpha = 0.35 + 0.55 * Math.abs(Math.sin(star.p));
          ctx.beginPath();
          ctx.fillStyle = `rgba(180,200,255,${alpha})`;
          ctx.arc(star.x, star.y, star.r, 0, Math.PI * 2);
          ctx.fill();
        }
        requestAnimationFrame(tick);
      }
      addEventListener('resize', resize);
      resize(); tick();
    })();

    const dot = document.getElementById('conn-dot');
    const orb = document.getElementById('orb');
    const subtitle = document.getElementById('subtitle');
    const chatLog = document.getElementById('chat-log');
    const chatForm = document.getElementById('chat-form');
    const chatInput = document.getElementById('chat-input');
    const chatSend = document.getElementById('chat-send');
    const micBtn = document.getElementById('mic-btn');
    const voiceToggle = document.getElementById('voice-toggle');
    const devicesEl = document.getElementById('devices');
    const capsEl = document.getElementById('capabilities');
    const busLogEl = document.getElementById('bus-log');

    let thinkingEl = null;

    function addMsg(role, text) {
      const div = document.createElement('div');
      div.className = 'msg ' + role;
      div.textContent = text;
      chatLog.appendChild(div);
      chatLog.scrollTop = chatLog.scrollHeight;
      return div;
    }

    function showThinking() {
      thinkingEl = document.createElement('div');
      thinkingEl.className = 'msg thinking';
      thinkingEl.innerHTML = '<span></span><span></span><span></span>';
      chatLog.appendChild(thinkingEl);
      chatLog.scrollTop = chatLog.scrollHeight;
      orb.classList.add('thinking');
    }
    function hideThinking() {
      if (thinkingEl) { thinkingEl.remove(); thinkingEl = null; }
      orb.classList.remove('thinking');
    }

    // ---------- speech synthesis (RUDRA speaks back) ----------
    function speak(text) {
      if (!voiceToggle.checked || !text || !('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.rate = 1.02; utter.pitch = 0.95;
      window.speechSynthesis.speak(utter);
    }

    // ---------- speech recognition (mic input) ----------
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognizer = null;
    let listening = false;
    if (SpeechRecognition) {
      recognizer = new SpeechRecognition();
      recognizer.lang = 'en-US';
      recognizer.interimResults = false;
      recognizer.maxAlternatives = 1;
      recognizer.onresult = (ev) => {
        const said = ev.results[0][0].transcript;
        chatInput.value = said;
        chatForm.requestSubmit();
      };
      recognizer.onend = () => { listening = false; micBtn.classList.remove('active'); };
      recognizer.onerror = () => { listening = false; micBtn.classList.remove('active'); };
      micBtn.addEventListener('click', () => {
        if (listening) { recognizer.stop(); return; }
        window.speechSynthesis.cancel();
        listening = true;
        micBtn.classList.add('active');
        recognizer.start();
      });
    } else {
      micBtn.disabled = true;
      micBtn.title = 'Voice input not supported in this browser';
      micBtn.style.opacity = .35;
    }

    addMsg('sys', 'Connecting to RUDRA…');

    // --- chat over WebSocket, falls back to REST if the socket can't open ---
    const wsProto = location.protocol === 'https:' ? 'wss' : 'ws';
    let chatWs = null;
    let wsReady = false;

    function connectChatWs() {
      chatWs = new WebSocket(`${wsProto}://${location.host}/ws/chat`);
      chatWs.onopen = () => { wsReady = true; dot.className = 'dot online'; subtitle.textContent = 'online'; };
      chatWs.onclose = () => { wsReady = false; dot.className = 'dot offline'; subtitle.textContent = 'disconnected — retrying…'; setTimeout(connectChatWs, 2000); };
      chatWs.onerror = () => {};
      chatWs.onmessage = (ev) => {
        const msg = JSON.parse(ev.data);
        if (msg.type === 'reply') {
          hideThinking();
          addMsg('rudra', msg.text || '…');
          speak(msg.text);
          chatSend.disabled = false;
        }
      };
    }
    connectChatWs();

    chatForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const text = chatInput.value.trim();
      if (!text) return;
      addMsg('user', text);
      chatInput.value = '';
      chatSend.disabled = true;
      showThinking();
      if (wsReady) {
        chatWs.send(text);
      } else {
        try {
          const res = await fetch('/api/chat', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ text }),
          });
          const data = await res.json();
          hideThinking();
          addMsg('rudra', data.reply || '…');
          speak(data.reply);
        } catch (err) {
          hideThinking();
          addMsg('sys', 'Could not reach RUDRA: ' + err);
        } finally {
          chatSend.disabled = false;
        }
      }
    });

    // --- status polling: devices + capabilities ---
    async function refreshStatus() {
      try {
        const res = await fetch('/api/status');
        const data = await res.json();
        const devices = Object.entries(data.devices || {});
        devicesEl.textContent = devices.length
          ? devices.map(([id, d]) => `${id}  (${d.domain})`).join('\n')
          : '— none online —';
        capsEl.innerHTML = (data.capabilities || [])
          .map(c => `<span class="pill cap" title="${c.description}">${c.name}</span>`)
          .join('');
      } catch (err) { /* server may still be booting */ }
    }
    refreshStatus();
    setInterval(refreshStatus, 5000);

    // --- live log feed ---
    function connectLogWs() {
      const ws = new WebSocket(`${wsProto}://${location.host}/ws/logs`);
      let lines = [];
      ws.onopen = () => { busLogEl.textContent = ''; };
      ws.onmessage = (ev) => {
        const msg = JSON.parse(ev.data);
        if (msg.type === 'log') {
          lines.push(msg.line);
          if (lines.length > 60) lines.shift();
          busLogEl.textContent = lines.join('\n');
          busLogEl.scrollTop = busLogEl.scrollHeight;
        }
      };
      ws.onclose = () => setTimeout(connectLogWs, 2000);
    }
    connectLogWs();
  </script>
</body>
</html>

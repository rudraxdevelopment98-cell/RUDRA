# RUDRA MQTT broker config (Mosquitto 2.x)

# Standard MQTT.
listener 1883
# MQTT over WebSocket — used by the dashboard.
listener 9001
protocol websockets

# Security: require credentials. Generate a password file with:
#   docker run --rm -v "$PWD/infra:/m" eclipse-mosquitto:2 \
#     mosquitto_passwd -c -b /m/passwd rudra YOUR_BROKER_PASSWORD
# then set MQTT_USERNAME=rudra / MQTT_PASSWORD=YOUR_BROKER_PASSWORD in .env.
#
# For a quick localhost-only first boot you may temporarily flip this to
# `allow_anonymous true` and comment out password_file — but never once the
# broker is reachable beyond this machine.
allow_anonymous false
password_file /mosquitto/config/passwd

persistence true
persistence_location /mosquitto/data/

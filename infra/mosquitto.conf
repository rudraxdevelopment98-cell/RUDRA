# RUDRA MQTT broker config (Mosquitto 2.x)

# Standard MQTT.
listener 1883
# MQTT over WebSocket — used by the dashboard.
listener 9001
protocol websockets

# Phase 0: allow anonymous so the skeleton boots with zero setup.
# TODO(security): in production, set `allow_anonymous false` and add a
#                 password_file / per-device credentials. See docs/ARCHITECTURE.md §4.
allow_anonymous true

persistence true
persistence_location /mosquitto/data/
